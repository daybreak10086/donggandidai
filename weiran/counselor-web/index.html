<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未然 · 辅导员端</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登录页（占位） -->
  <div id="login-view" class="login-view">
    <div class="login-panel">
      <div class="brand serif">未然</div>
      <div class="brand-sub">高校学生画像与预警平台 · 辅导员端</div>
      <button class="login-btn" onclick="App.login()">进入系统</button>
      <p class="login-tip">页面框架已就绪，业务内容待开发</p>
    </div>
  </div>

  <!-- 主框架 -->
  <div id="shell-view" class="shell" hidden>
    <aside class="sidebar">
      <div class="logo serif">未然</div>
      <div class="logo-sub">辅导员端</div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">当前账号：辅导员（演示）</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title" class="page-title"></h1>
        <button class="logout-btn" onclick="App.logout()">退出登录</button>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
